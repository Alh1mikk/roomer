[package]
name = "roomer_backend"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.5", features = ["cors"] }
futures-util = "0.3"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Стабильный стек шифрования на чистом Rust
tokio-postgres = { version = "0.7", features = ["runtime"] }
postgres_rustls = "0.24"
rustls = "0.23"
webpki-roots = "0.26"
