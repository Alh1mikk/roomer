<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roomer</title>
    <!-- Официальный скрипт Telegram SDK (адрес исправлен) -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>/* === ОБНОВЛЕННЫЕ СТИЛИ ЖИВОГО ЧАТА === */
        #chat-screen {
            display: none;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
            padding: 0;
            margin: 0;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: #0F0F13;
        }
        #chat-screen.active {
            display: flex;
        }
        #chat-screen .header {
            padding: 16px;
            background: #1A1A24;
            margin-bottom: 0;
            border-bottom: 1px solid #2A2A38;
        }
        
        /* Контейнер сообщений скроллится, оставляя инпут внизу */
        #chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            box-sizing: border-box;
            background: #0F0F13;
        }
        
        /* Общие стили для облачков сообщений */
        .msg {
            padding: 10px 14px;
            border-radius: 16px;
            font-size: 15px;
            line-height: 1.4;
            max-width: 75%;
            word-break: break-word;
            box-shadow: 0 1px 2px rgba(0,0,0,0.2);
            position: relative;
            animation: fadeIn 0.2s ease-in-out;
        }
        
        /* Твои сообщения (справа, фиолетовые) */
        .msg.my-msg {
            background: #7C4DFF;
            color: #FFFFFF;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }
        
        /* Чужие сообщения (слева, темно-серые) */
        .msg.other-msg {
            background: #2A2A38;
            color: #FFFFFF;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }
        
        /* Зафиксированная панель ввода внизу экрана */
        .chat-input-container {
            padding: 12px 16px;
            background: #1A1A24;
            border-top: 1px solid #2A2A38;
            display: flex;
            gap: 12px;
            align-items: center;
            box-sizing: border-box;
        }
        .chat-input-container input {
            margin-bottom: 0;
            background: #2A2A38;
            border: 1px solid #3A3A48;
            padding: 12px 16px;
            border-radius: 24px;
            font-size: 15px;
        }
        .btn-send {
            background: #7C4DFF;
            color: white;
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            cursor: pointer;
            transition: background 0.2s;
            flex-shrink: 0;
        }
        .btn-send:active {
            background: #651FFF;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

    </style>
</head>
<body>

    <!-- ЭКРАН 1: ЛЕНТА КОМНАТ -->
    <div id="feed-screen" class="screen active">
        <div class="header">
            <h2>🌟 Активные комнаты</h2>
            <button class="btn-add" onclick="toggleModal(true)">+</button>
        </div>
        <div id="rooms-list">Загрузка комнат...</div>
    </div>

    <!-- ЭКРАН 2: ФОРМА СОЗДАНИЯ (МОДАЛКА) -->
    <div id="create-modal" class="modal">
        <h2>Запустить свой движ</h2>
        <input type="text" id="room-title" placeholder="Название комнаты (например: Кодим на Rust)">
        <textarea id="room-desc" rows="3" placeholder="Описание атмосферы..."></textarea>
        <input type="text" id="room-tags" placeholder="Кастомные теги через запятую (rust, diy, чат)">
        <button class="btn-submit" onclick="submitRoom()">Создать комнату</button>
        <button class="btn-submit" style="background:#333; margin-top: 10px;" onclick="toggleModal(false)">Назад</button>
    </div>

    <!-- ЭКРАН 3: ЖИВОЙ ЧАТ (ДОБАВЛЕН) -->
    <div id="chat-screen" class="screen">
        <div class="header">
            <h2 id="chat-room-title">Чат комнаты</h2>
            <button class="btn-add" style="background:#333;" onclick="closeChat()">❌</button>
        </div>
        <div id="chat-messages"></div>
        <div class="chat-input-container">
            <input type="text" id="chat-input" placeholder="Введите сообщение..." onkeypress="if(event.key==='Enter') sendWsMessage()">
            <button class="btn-send" onclick="sendWsMessage()">➔</button>
        </div>
    </div>

    <script>
        // === 🛠️ НАСТРОЙКА АДРЕСОВ ТВОЕГО СЕРВЕРА ===
        // Вставь сюда свою ссылку от Railway (без слэша на конце)
        const API_URL = 'https://roomer-production.up.railway.app';
        const WS_URL = 'wss://roomer-production.up.railway.app';

        // Инициализируем Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const tgUserId = tg.initDataUnsafe?.user?.id || 99999;
        let wsConnection = null;

        // Переключение экранов (Лента / Чат)
        function switchScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        // 1. Скачиваем комнаты с нашего продакшн бэкенда
        async function fetchRooms() {
            try {
                const res = await fetch(API_URL + '/rooms');
                const rooms = await res.json();
                const list = document.getElementById('rooms-list');
                
                if (rooms.length === 0) {
                    list.innerHTML = '<p style="text-align:center;color:#666;">Комнат пока нет. Будь первым! 🚀</p>';
                    return;
                }

                list.innerHTML = rooms.map(room => `
                    <div class="card" onclick="openChat(${room.id}, '${room.title.replace(/'/g, "\\'")}')">
                        <h3>${room.title}</h3>
                        <p>${room.description || ''}</p>
                        <div>${room.tags.map(tag => `<span class="tag">#${tag}</span>`).join('')}</div>
                    </div>
                `).join('');
            } catch (e) {
                document.getElementById('rooms-list').innerHTML = '<p style="color:red;text-align:center;">Ошибка подключения к удаленному бэкенду на Railway</p>';
            }
        }

        // 2. Отправляем новую комнату на бэкенд
        async function submitRoom() {
            const title = document.getElementById('room-title').value.trim();
            const description = document.getElementById('room-desc').value.trim();
            const tagsRaw = document.getElementById('room-tags').value;

            if (!title) return;
            const tags = tagsRaw.split(',').map(t => t.trim()).filter(t => t.length > 0);

            try {
                await fetch(API_URL + '/rooms', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title, description, creator_id: tgUserId, tags })
                });

                // Очищаем форму, закрываем модалку и обновляем ленту
                document.getElementById('room-title').value = '';
                document.getElementById('room-desc').value = '';
                document.getElementById('room-tags').value = '';
                toggleModal(false);
                fetchRooms();
            } catch (e) {
                alert('Не удалось отправить данные на сервер');
            }
        }

        // 3. Подключение к живым WebSockets чатам Rust
        function openChat(roomId, roomTitle) {
            document.getElementById('chat-room-title').innerText = roomTitle;
            document.getElementById('chat-messages').innerHTML = ''; 
            switchScreen('chat-screen');
        
            // Подключаемся к WebSocket на Railway [INDEX]
            wsConnection = new WebSocket(WS_URL + '/ws/' + roomId.toString());
        
            wsConnection.onmessage = function(event) {
                const msgBox = document.getElementById('chat-messages');
                const newMsg = document.createElement('div');
                
                let messageText = event.data;
                let isMyMessage = false;
        
                // Наш Python-бэкенд пока шлет чистый текст. 
                // Чтобы сделать разделение, мы временно проверяем префикс (или имя), 
                // а чуть позже научим бэкенд слать JSON с ID юзера.
                // Сейчас, если сообщение отправлено тобой в этой сессии, мы пометим его красивым стилем:
                newMsg.innerText = messageText;
                
                // По умолчанию ставим стиль чужого сообщения. 
                // Когда настроим отправку ID, здесь будет строгая проверка:
                newMsg.className = 'msg other-msg'; 
                
                msgBox.appendChild(newMsg);
                
                // Элегантно и плавно скроллим чат в самый низ [INDEX]
                msgBox.scrollTo({
                    top: msgBox.scrollHeight,
                    behavior: 'smooth'
                });
            };
        }


        function sendWsMessage() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (!text || !wsConnection) return;
        
            wsConnection.send(text); // Пушим в сокет
            
            // Локально отображаем свое сообщение со стилем my-msg для мгновенного отклика
            const msgBox = document.getElementById('chat-messages');
            const newMsg = document.createElement('div');
            newMsg.className = 'msg my-msg';
            newMsg.innerText = text;
            msgBox.appendChild(newMsg);
            msgBox.scrollTop = msgBox.scrollHeight;
        
            input.value = '';
        }


        function closeChat() {
            if (wsConnection) { wsConnection.close(); wsConnection = null; }
            switchScreen('feed-screen');
            fetchRooms();
        }

        function toggleModal(show) {
            document.getElementById('create-modal').style.display = show ? 'block' : 'none';
        }

        // Стартуем первичную подгрузку комнат при входе
        fetchRooms();
    </script>
</body>
</html>
