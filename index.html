<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Roomer</title>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #0F0F13;
            color: #E8E8ED;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .screen { 
            display: none;
            min-height: 100vh;
        }

        .screen.active {
            display: block;
        }

        /* ── Header ── */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            background: #1A1A24;
            border-bottom: 1px solid #2A2A38;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .header h2 {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: -0.02em;
            color: #F0F0F5;
        }

        .header .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* ── Status indicator ── */
        .connection-status {
            font-size: 12px;
            padding: 4px 8px;
            border-radius: 12px;
            margin-left: 10px;
        }

        .status-connected {
            background: rgba(76, 175, 80, 0.2);
            color: #4CAF50;
        }

        .status-disconnected {
            background: rgba(244, 67, 54, 0.2);
            color: #F44336;
        }

        .status-connecting {
            background: rgba(255, 152, 0, 0.2);
            color: #FF9800;
        }

        /* ── Buttons ── */
        .btn-add {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            border: none;
            background: #2A2A38;
            color: #C0C0D0;
            font-size: 20px;
            font-weight: 300;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s, color 0.2s;
            line-height: 1;
        }

        .btn-add:hover {
            background: #3A3A48;
            color: #FFFFFF;
        }

        .btn-add:active {
            background: #4A4A58;
        }

        .btn-back {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            border: none;
            background: #2A2A38;
            color: #C0C0D0;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s, color 0.2s;
        }

        .btn-back:hover {
            background: #3A3A48;
            color: #FFFFFF;
        }

        /* ── Rooms Feed ── */
        #rooms-list {
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        #rooms-list .empty-state {
            text-align: center;
            color: #6B6B80;
            font-size: 15px;
            padding: 48px 16px;
            line-height: 1.6;
        }

        .card {
            background: #1A1A24;
            border: 1px solid #2A2A38;
            border-radius: 14px;
            padding: 16px;
            cursor: pointer;
            transition: border-color 0.2s, background 0.2s, transform 0.15s;
        }

        .card:hover {
            border-color: #7C4DFF;
            background: #1E1E2A;
            transform: translateY(-1px);
        }

        .card:active {
            transform: translateY(0);
        }

        .card h3 {
            font-size: 16px;
            font-weight: 600;
            color: #F0F0F5;
            margin-bottom: 6px;
        }

        .card p {
            font-size: 14px;
            color: #9B9BB0;
            line-height: 1.5;
            margin-bottom: 10px;
        }

        .card .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .card .tag {
            font-size: 12px;
            color: #7C4DFF;
            background: rgba(124, 77, 255, 0.1);
            padding: 4px 10px;
            border-radius: 6px;
            letter-spacing: -0.01em;
        }

        .card .online-badge {
            font-size: 11px;
            color: #4CAF50;
            background: rgba(76, 175, 80, 0.1);
            padding: 2px 8px;
            border-radius: 10px;
            margin-left: 8px;
        }

        /* ── Modal ── */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            z-index: 100;
            padding: 24px;
            overflow-y: auto;
        }

        .modal-inner {
            max-width: 400px;
            margin: 60px auto;
            background: #1A1A24;
            border: 1px solid #2A2A38;
            border-radius: 16px;
            padding: 24px;
        }

        .modal-inner h2 {
            font-size: 20px;
            font-weight: 600;
            color: #F0F0F5;
            margin-bottom: 20px;
            letter-spacing: -0.02em;
        }

        .modal-inner input,
        .modal-inner textarea {
            width: 100%;
            background: #2A2A38;
            border: 1px solid #3A3A48;
            border-radius: 10px;
            padding: 12px 14px;
            font-size: 15px;
            font-family: inherit;
            color: #E8E8ED;
            outline: none;
            transition: border-color 0.2s;
            margin-bottom: 12px;
        }

        .modal-inner input:focus,
        .modal-inner textarea:focus {
            border-color: #7C4DFF;
        }

        .modal-inner input::placeholder,
        .modal-inner textarea::placeholder {
            color: #6B6B80;
        }

        .modal-inner textarea {
            resize: vertical;
            min-height: 80px;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            font-size: 15px;
            font-weight: 600;
            font-family: inherit;
            border: none;
            border-radius: 10px;
            background: #7C4DFF;
            color: #FFFFFF;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-submit:hover {
            background: #6C3DFF;
        }

        .btn-submit:active {
            background: #5C2DFF;
        }

        .btn-submit.secondary {
            background: #2A2A38;
            color: #C0C0D0;
            margin-top: 8px;
        }

        .btn-submit.secondary:hover {
            background: #3A3A48;
            color: #F0F0F5;
        }

        /* ── Chat Screen ── */
        #chat-screen {
            display: none;
            flex-direction: column;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: #0F0F13;
        }

        #chat-screen.active {
            display: flex;
        }

        #chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .msg {
            padding: 10px 14px;
            border-radius: 16px;
            font-size: 15px;
            line-height: 1.4;
            max-width: 80%;
            word-break: break-word;
            animation: msgIn 0.2s ease-out;
        }

        .msg.my-msg {
            background: #7C4DFF;
            color: #FFFFFF;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .msg.other-msg {
            background: #2A2A38;
            color: #E8E8ED;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .msg.system-msg {
            background: transparent;
            color: #6B6B80;
            align-self: center;
            font-size: 13px;
            font-style: italic;
            text-align: center;
            max-width: 100%;
        }

        @keyframes msgIn {
            from {
                opacity: 0;
                transform: translateY(6px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .chat-input-container {
            padding: 12px 16px;
            background: #1A1A24;
            border-top: 1px solid #2A2A38;
            display: flex;
            gap: 10px;
            align-items: center;
            padding-bottom: calc(12px + env(safe-area-inset-bottom));
        }

        .chat-input-container input {
            flex: 1;
            background: #2A2A38;
            border: 1px solid #3A3A48;
            padding: 12px 16px;
            border-radius: 24px;
            font-size: 15px;
            font-family: inherit;
            color: #E8E8ED;
            outline: none;
            transition: border-color 0.2s;
        }

        .chat-input-container input:focus {
            border-color: #7C4DFF;
        }

        .chat-input-container input::placeholder {
            color: #6B6B80;
        }

        .btn-send {
            background: #7C4DFF;
            color: white;
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.2s, transform 0.15s;
            flex-shrink: 0;
        }

        .btn-send:hover {
            background: #6C3DFF;
        }

        .btn-send:active {
            background: #5C2DFF;
            transform: scale(0.95);
        }

        /* ── Scrollbar ── */
        ::-webkit-scrollbar {
            width: 4px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #3A3A48;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #4A4A58;
        }
    </style>
</head>
<body>

    <!-- FEED SCREEN -->
    <div id="feed-screen" class="screen active">
        <div class="header">
            <h2>Активные комнаты</h2>
            <button class="btn-add" onclick="toggleModal(true)">+</button>
        </div>
        <div id="rooms-list">Загрузка комнат...</div>
    </div>

    <!-- MODAL -->
    <div id="create-modal" class="modal">
        <div class="modal-inner">
            <h2>Создать комнату</h2>
            <input type="text" id="room-title" placeholder="Название комнаты">
            <textarea id="room-desc" rows="3" placeholder="Описание"></textarea>
            <input type="text" id="room-tags" placeholder="Теги через запятую (rust, design, chat)">
            <button class="btn-submit" onclick="submitRoom()">Создать</button>
            <button class="btn-submit secondary" onclick="toggleModal(false)">Отмена</button>
        </div>
    </div>

    <!-- CHAT SCREEN -->
    <div id="chat-screen" class="screen">
        <div class="header">
            <div class="header-left">
                <button class="btn-back" onclick="closeChat()">&larr;</button>
                <h2 id="chat-room-title">Чат</h2>
                <span id="connection-status" class="connection-status status-connecting">подключение...</span>
            </div>
        </div>
        <div id="chat-messages"></div>
        <div class="chat-input-container">
            <input type="text" id="chat-input" placeholder="Сообщение..." onkeypress="if(event.key==='Enter') sendWsMessage()">
            <button class="btn-send" onclick="sendWsMessage()">&rarr;</button>
        </div>
    </div>

    <script>
        // === НАСТРОЙКА АДРЕСОВ ===
        const API_URL = 'https://roomer-alh1mikk.amvera.io';
        const WS_URL = 'wss://roomer-alh1mikk.amvera.io';
        
        // Инициализация Telegram WebApp
        let tg = null;
        let tgUserId = Math.floor(Math.random() * 90000) + 10000;
        let tgUserName = "Аноним";
        
        if (window.Telegram && window.Telegram.WebApp) {
            tg = window.Telegram.WebApp;
            tg.ready();
            tg.expand();
            if (tg.initDataUnsafe?.user?.id) {
                tgUserId = tg.initDataUnsafe.user.id;
                tgUserName = tg.initDataUnsafe.user.first_name || "Юзер Telegram";
            }
        }
        
        let wsConnection = null;
        let pingInterval = null;
        let currentRoomId = null;
        let shouldReconnect = false;
        
        function switchScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            const el = document.getElementById(screenId);
            if (el) el.classList.add('active');
        }
        
        // Функция для fetch с CORS
        async function apiFetch(url, options = {}) {
            const defaultOptions = {
                mode: 'cors',
                headers: {
                    'Content-Type': 'application/json',
                },
            };
            
            const mergedOptions = { ...defaultOptions, ...options };
            if (mergedOptions.headers) {
                mergedOptions.headers = { ...defaultOptions.headers, ...options.headers };
            }
            
            console.log('Fetching:', API_URL + url);
            const response = await fetch(API_URL + url, mergedOptions);
            
            if (!response.ok) {
                throw new Error(`HTTP ${response.status}: ${response.statusText}`);
            }
            
            return response.json();
        }
        
        // Загрузка комнат
        async function fetchRooms() {
            try {
                console.log('Fetching rooms...');
                const rooms = await apiFetch('/rooms');
                console.log('Rooms loaded:', rooms);
                
                const list = document.getElementById('rooms-list');
                if (!rooms || rooms.length === 0) {
                    list.innerHTML = '<div class="empty-state">Комнат пока нет.<br>Создайте первую!</div>';
                    return;
                }
        
                list.innerHTML = rooms.map(room => `
                    <div class="card" onclick="openChat(${room.id}, '${(room.title || '').replace(/'/g, "\\'")}')">
                        <h3>
                            ${room.title || 'Без названия'}
                            ${room.online ? `<span class="online-badge">● ${room.online}</span>` : ''}
                        </h3>
                        <p>${room.description || ''}</p>
                        <div class="tags">${(room.tags || []).map(tag => `<span class="tag">#${tag}</span>`).join('')}</div>
                    </div>
                `).join('');
            } catch (e) {
                console.error('Error fetching rooms:', e);
                document.getElementById('rooms-list').innerHTML = 
                    `<div class="empty-state" style="color:#E55;">Ошибка подключения: ${e.message}</div>`;
            }
        }
        
        // Создание комнаты
        async function submitRoom() {
            const title = document.getElementById('room-title').value.trim();
            const description = document.getElementById('room-desc').value.trim();
            const tagsRaw = document.getElementById('room-tags').value;
        
            if (!title) return;
            const tags = tagsRaw.split(',').map(t => t.trim()).filter(t => t.length > 0);
        
            try {
                await apiFetch('/rooms', {
                    method: 'POST',
                    body: JSON.stringify({ title, description, creator_id: tgUserId, tags })
                });
        
                document.getElementById('room-title').value = '';
                document.getElementById('room-desc').value = '';
                document.getElementById('room-tags').value = '';
                toggleModal(false);
                fetchRooms();
            } catch (e) {
                console.error('Error creating room:', e);
                alert('Не удалось создать комнату: ' + e.message);
            }
        }
        
        // WebSocket подключение
        function setupWebSocket(roomId) {
            if (wsConnection) {
                wsConnection.onclose = null;
                wsConnection.close();
                wsConnection = null;
            }
        
            if (pingInterval) {
                clearInterval(pingInterval);
                pingInterval = null;
            }
        
            const wsUrl = WS_URL + '/ws/' + roomId;
            console.log("🔌 Connecting to WebSocket:", wsUrl);
            
            try {
                wsConnection = new WebSocket(wsUrl);
            } catch (e) {
                console.error("❌ WebSocket creation error:", e);
                return;
            }
        
            wsConnection.onopen = function() {
                console.log("✅ WebSocket connected to room", roomId);
                
                pingInterval = setInterval(() => {
                    if (wsConnection && wsConnection.readyState === WebSocket.OPEN) {
                        wsConnection.send(JSON.stringify({ type: 'ping' }));
                    }
                }, 25000);
            };
        
            wsConnection.onerror = function(error) {
                console.error("❌ WebSocket error:", error);
            };
        
            wsConnection.onclose = function(event) {
                console.log("🔌 WebSocket closed. Code:", event.code);
                
                if (pingInterval) {
                    clearInterval(pingInterval);
                    pingInterval = null;
                }
                
                if (shouldReconnect && currentRoomId === roomId) {
                    setTimeout(() => {
                        if (shouldReconnect && currentRoomId === roomId) {
                            setupWebSocket(roomId);
                        }
                    }, 2000);
                }
            };
        
            wsConnection.onmessage = function(event) {
                try {
                    const msgData = JSON.parse(event.data);
                    const msgBox = document.getElementById('chat-messages');
                    
                    if (!msgBox) return;
                    
                    if (msgData.type === 'ping' || msgData.type === 'pong') {
                        return;
                    }
                    
                    if (msgData.text === "системное_сообщение_подключено" || msgData.sender_id === -1) {
                        console.log("🚀 WebSocket handshake successful");
                        return;
                    }
                    
                    const newMsg = document.createElement('div');
                    newMsg.textContent = msgData.text;
                    
                    if (msgData.type === 'system') {
                        newMsg.className = 'msg system-msg';
                    } else if (msgData.sender_id != null && Number(msgData.sender_id) === Number(tgUserId)) {
                        newMsg.className = 'msg my-msg';
                    } else {
                        newMsg.className = 'msg other-msg';
                    }
                    
                    msgBox.appendChild(newMsg);
                    msgBox.scrollTo({ top: msgBox.scrollHeight, behavior: 'smooth' });
                    
                } catch (e) {
                    console.error("❌ Message parse error:", e);
                }
            };
        }
        
        function openChat(roomId, roomTitle) {
            currentRoomId = roomId;
            shouldReconnect = true;
            
            document.getElementById('chat-room-title').innerText = roomTitle;
            document.getElementById('chat-messages').innerHTML = '';
            switchScreen('chat-screen');
            
            setTimeout(() => setupWebSocket(roomId), 100);
        }
        
        function sendWsMessage() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            
            if (!text) return;
            
            if (!wsConnection || wsConnection.readyState !== WebSocket.OPEN) {
                if (currentRoomId) setupWebSocket(currentRoomId);
                return;
            }
            
            wsConnection.send(JSON.stringify({ text: text, sender_id: tgUserId }));
            input.value = '';
        }
        
        function closeChat() {
            shouldReconnect = false;
            currentRoomId = null;
            
            if (pingInterval) {
                clearInterval(pingInterval);
                pingInterval = null;
            }
            
            if (wsConnection) {
                wsConnection.onclose = null;
                wsConnection.close();
                wsConnection = null;
            }
            
            switchScreen('feed-screen');
            fetchRooms();
        }
        
        function toggleModal(show) {
            document.getElementById('create-modal').style.display = show ? 'block' : 'none';
        }
        
        // Закрытие модального окна
        document.getElementById('create-modal').addEventListener('click', function(e) {
            if (e.target === this) toggleModal(false);
        });
        
        // Запуск
        fetchRooms();
        console.log("🚀 Roomer initialized!");
    </script>
</body>
</html>
