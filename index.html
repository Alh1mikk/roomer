<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Roomer</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;background:#0F0F13;color:#E8E8ED;min-height:100vh;-webkit-font-smoothing:antialiased}
.screen{display:none;min-height:100vh}.screen.active{display:block}
.header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:#1A1A24;border-bottom:1px solid #2A2A38;position:sticky;top:0;z-index:10}
.header h2{font-size:17px;font-weight:600;color:#F0F0F5}
.header-left{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.header-left h2{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.header-right{display:flex;align-items:center;gap:6px}
.search-bar{display:flex;padding:8px 12px;background:#1A1A24;gap:6px;border-bottom:1px solid #2A2A38}
.search-bar input{flex:1;background:#2A2A38;border:1px solid #3A3A48;border-radius:10px;padding:8px 12px;font-size:14px;font-family:inherit;color:#E8E8ED;outline:none}
.search-bar input:focus{border-color:#7C4DFF}
.btn-clear{background:transparent;border:none;color:#6B6B80;font-size:16px;cursor:pointer;display:none}
.btn-clear.visible{display:block}
.tabs{display:flex;background:#1A1A24;border-bottom:1px solid #2A2A38;padding:0 12px}
.tab{padding:10px 14px;font-size:13px;font-weight:500;color:#6B6B80;cursor:pointer;border-bottom:2px solid transparent}
.tab.active{color:#7C4DFF;border-bottom-color:#7C4DFF}
.status-connected{background:rgba(76,175,80,0.2);color:#4CAF50;padding:2px 8px;border-radius:10px;font-size:11px}
.status-disconnected{background:rgba(244,67,54,0.2);color:#F44336;padding:2px 8px;border-radius:10px;font-size:11px}
.status-connecting{background:rgba(255,152,0,0.2);color:#FF9800;padding:2px 8px;border-radius:10px;font-size:11px}
.btn-icon{width:34px;height:34px;border-radius:8px;border:none;background:#2A2A38;color:#C0C0D0;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px}
.btn-icon:hover{background:#3A3A48}
#rooms-list{padding:12px;display:flex;flex-direction:column;gap:10px}
.empty-state{text-align:center;color:#6B6B80;font-size:14px;padding:40px 16px;line-height:1.6}
.card{background:#1A1A24;border:1px solid #2A2A38;border-radius:12px;padding:14px;cursor:pointer}
.card:hover{border-color:#7C4DFF}
.card h3{font-size:15px;font-weight:600;color:#F0F0F5;margin-bottom:4px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.card p{font-size:13px;color:#9B9BB0;margin-bottom:8px;line-height:1.4}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tag{font-size:11px;color:#7C4DFF;background:rgba(124,77,255,0.1);padding:3px 8px;border-radius:5px}
.online-badge{font-size:11px;color:#4CAF50;background:rgba(76,175,80,0.1);padding:2px 6px;border-radius:8px}
.card-actions{display:flex;align-items:center;gap:6px;margin-top:6px;flex-wrap:wrap}
.action-btn,.favorite-btn{display:inline-flex;align-items:center;gap:3px;padding:3px 8px;border-radius:6px;font-size:11px;cursor:pointer;border:1px solid #3A3A48;background:#2A2A38;color:#9B9BB0;font-family:inherit}
.action-btn:hover,.favorite-btn:hover{border-color:#7C4DFF}
.action-btn.liked{border-color:#4CAF50;color:#4CAF50}
.action-btn.disliked{border-color:#F44336;color:#F44336}
.favorite-btn.is-fav{border-color:#FFD700;color:#FFD700}
.loading{background:linear-gradient(90deg,#1A1A24 25%,#222233 50%,#1A1A24 75%);background-size:200% 100%;animation:shimmer 1.5s ease-in-out infinite;border-radius:12px;height:100px;margin-bottom:10px}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.spinning{animation:spin .6s ease-in-out}
@keyframes spin{to{transform:rotate(360deg)}}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.7);backdrop-filter:blur(8px);z-index:100;padding:20px;overflow-y:auto}
.modal-inner{max-width:380px;margin:50px auto;background:#1A1A24;border:1px solid #2A2A38;border-radius:14px;padding:20px}
.modal-inner h2{font-size:18px;font-weight:600;color:#F0F0F5;margin-bottom:16px}
.modal-inner label{display:block;font-size:12px;color:#9B9BB0;margin-bottom:4px}
.modal-inner input,.modal-inner textarea{width:100%;background:#2A2A38;border:1px solid #3A3A48;border-radius:8px;padding:10px 12px;font-size:14px;font-family:inherit;color:#E8E8ED;outline:none;margin-bottom:10px}
.modal-inner input:focus,.modal-inner textarea:focus{border-color:#7C4DFF}
.btn-submit{width:100%;padding:10px;font-size:14px;font-weight:600;font-family:inherit;border:none;border-radius:8px;background:#7C4DFF;color:#fff;cursor:pointer}
.btn-submit:hover{background:#6C3DFF}
.btn-submit.secondary{background:#2A2A38;color:#C0C0D0;margin-top:6px}
.btn-submit.danger{background:#D32F2F;color:#fff;margin-top:6px}

#chat-screen{display:none;flex-direction:column;height:100vh;position:fixed;top:0;left:0;width:100%;background:#0F0F13}
#chat-screen.active{display:flex}
#chat-messages{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:4px;padding-bottom:60px}

.msg{display:flex;flex-direction:column;max-width:85%;margin-bottom:2px;position:relative;animation:msgIn .15s ease-out}
.msg .bubble{padding:8px 12px;border-radius:14px;font-size:14px;line-height:1.4;word-break:break-word;position:relative}
.msg .bubble .reply-block{background:rgba(255,255,255,.08);border-left:3px solid #7C4DFF;padding:4px 8px;border-radius:6px;font-size:11px;margin-bottom:4px;color:rgba(255,255,255,.5)}
.msg .bubble .reply-block .reply-author{font-weight:600;font-size:10px}
.msg .bubble .msg-author{font-size:10px;font-weight:600;margin-bottom:2px;color:rgba(255,255,255,.5)}
.msg .bubble .msg-footer{display:flex;align-items:center;gap:4px;margin-top:2px}
.msg .bubble .msg-footer .msg-time{font-size:9px;color:rgba(255,255,255,.4)}
.msg .bubble .msg-footer .msg-edited{font-size:9px;color:rgba(255,255,255,.3)}

.msg.my-msg{align-self:flex-end;align-items:flex-end}
.msg.my-msg .bubble{background:#7C4DFF;color:#fff;border-bottom-right-radius:4px}
.msg.my-msg .bubble .msg-author{color:rgba(255,255,255,.6)}
.msg.my-msg .bubble .reply-block{border-left-color:#B388FF;background:rgba(255,255,255,.12)}

.msg.other-msg{align-self:flex-start;align-items:flex-start}
.msg.other-msg .bubble{background:#2A2A38;color:#E8E8ED;border-bottom-left-radius:4px}
.msg.other-msg .bubble .reply-block{border-left-color:#7C4DFF}

.msg.deleted-msg{align-self:center}
.msg.deleted-msg .bubble{background:transparent;color:#555;font-size:12px;font-style:italic;border:1px dashed #3A3A48;border-radius:8px;padding:4px 12px}
.msg.system-msg{align-self:center}
.msg.system-msg .bubble{background:transparent;color:#6B6B80;font-size:12px;text-align:center;padding:4px 8px}

.msg-actions{display:none;position:absolute;top:-20px;right:0;background:#1A1A24;border:1px solid #2A2A38;border-radius:6px;padding:2px;gap:2px;z-index:5}
.msg:hover .msg-actions{display:flex}
.msg-action-btn{background:none;border:none;color:#9B9BB0;cursor:pointer;font-size:10px;padding:3px 6px;border-radius:4px;font-family:inherit}
.msg-action-btn:hover{background:#2A2A38;color:#fff}

@keyframes msgIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.chat-input-container{padding:8px 12px;background:#1A1A24;border-top:1px solid #2A2A38;display:flex;gap:8px;align-items:center;padding-bottom:calc(8px + env(safe-area-inset-bottom))}
.chat-input-container input{flex:1;background:#2A2A38;border:1px solid #3A3A48;padding:10px 14px;border-radius:20px;font-size:14px;font-family:inherit;color:#E8E8ED;outline:none}
.chat-input-container input:focus{border-color:#7C4DFF}
.btn-send{background:#7C4DFF;color:#fff;border:none;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;font-size:16px}
.btn-send:disabled{opacity:.4}
.reply-bar{display:none;padding:6px 12px;background:#2A2A38;border-top:1px solid #3A3A48;font-size:12px;color:#9B9BB0;align-items:center;gap:8px}
.reply-bar .reply-label{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.reply-bar .reply-label .reply-name{color:#7C4DFF;font-weight:600}
.reply-bar .reply-cancel{background:none;border:none;color:#6B6B80;cursor:pointer;font-size:14px}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);background:#1A1A24;border:1px solid #2A2A38;border-radius:10px;padding:8px 16px;font-size:12px;color:#E8E8ED;opacity:0;transition:opacity .3s,transform .3s;z-index:200;pointer-events:none;max-width:90%;text-align:center}
.toast.visible{opacity:1;transform:translateX(-50%) translateY(0)}

/* Участники */
.participant-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #2A2A38}
.participant-item:last-child{border-bottom:none}
.participant-avatar{width:36px;height:36px;border-radius:50%;background:#7C4DFF;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;color:#fff;flex-shrink:0}
.participant-info{flex:1;min-width:0}
.participant-name{font-size:14px;color:#F0F0F5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.participant-role{font-size:11px;color:#9B9BB0;margin-top:2px}
.participant-role .role-badge{display:inline-block;padding:1px 6px;border-radius:4px;font-size:10px;font-weight:600}
.role-badge.creator{background:rgba(255,215,0,0.2);color:#FFD700}
.role-badge.admin{background:rgba(124,77,255,0.2);color:#B388FF}
.role-badge.member{background:rgba(76,175,80,0.2);color:#4CAF50}
.role-badge.guest{background:rgba(158,158,158,0.2);color:#9E9E9E}
.participant-status{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.participant-status.online{background:#4CAF50}
.participant-status.offline{background:#6B6B80}
.participants-count{font-size:12px;color:#6B6B80;margin-bottom:12px}

::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#3A3A48;border-radius:3px}
</style>
</head>
<body>
<div id="toast" class="toast"></div>
<div id="feed-screen" class="screen active">
<div class="header"><h2>Roomer</h2><div class="header-right">
<button class="btn-icon btn-refresh" onclick="refreshRooms(this)" title="Обновить">&#x21bb;</button>
<button class="btn-icon" onclick="toggleModal(true)" title="Создать">+</button>
</div></div>
<div class="search-bar">
<input type="text" id="search-input" placeholder="Поиск..." autocomplete="off">
<button class="btn-clear" id="btn-clear-search" onclick="clearSearch()">x</button>
</div>
<div class="tabs">
<div class="tab active" data-tab="all" onclick="switchTab('all')">Все</div>
<div class="tab" data-tab="my" onclick="switchTab('my')">Мои</div>
</div>
<div id="rooms-list"><div class="loading"></div><div class="loading"></div><div class="loading"></div></div>
</div>
<div id="create-modal" class="modal">
<div class="modal-inner">
<h2>Создать комнату</h2>
<label>Название</label><input type="text" id="room-title" maxlength="100" placeholder="Название">
<label>Описание</label><textarea id="room-desc" rows="2" maxlength="500" placeholder="О чём эта комната?"></textarea>
<label>Теги</label><input type="text" id="room-tags" placeholder="rust, design (через запятую)">
<button class="btn-submit" id="btn-create-room" onclick="submitRoom()">Создать</button>
<button class="btn-submit secondary" onclick="toggleModal(false)">Отмена</button>
</div>
</div>
<div id="participants-modal" class="modal">
<div class="modal-inner">
<h2 id="participants-modal-title">Участники</h2>
<div class="participants-count" id="participants-count">загрузка...</div>
<div id="participants-list"></div>
<button class="btn-submit secondary" onclick="toggleParticipantsModal(false)">Закрыть</button>
</div>
</div>
<div id="premium-modal" class="modal">
<div class="modal-inner">
<h2>&#x2605; Roomer Premium</h2>
<p style="font-size:13px;color:#9B9BB0;margin-bottom:16px;line-height:1.5">
Выберите цвет своих сообщений в чате. Премиум действует 30 дней.
</p>
<label>Цвет сообщений</label>
<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px" id="premium-colors">
<button class="premium-color-btn" data-color="#7C4DFF" style="width:40px;height:40px;border-radius:50%;border:3px solid transparent;cursor:pointer;background:#7C4DFF" onclick="selectPremiumColor(this,'#7C4DFF')"></button>
<button class="premium-color-btn" data-color="#4CAF50" style="width:40px;height:40px;border-radius:50%;border:3px solid transparent;cursor:pointer;background:#4CAF50" onclick="selectPremiumColor(this,'#4CAF50')"></button>
<button class="premium-color-btn" data-color="#FF5722" style="width:40px;height:40px;border-radius:50%;border:3px solid transparent;cursor:pointer;background:#FF5722" onclick="selectPremiumColor(this,'#FF5722')"></button>
<button class="premium-color-btn" data-color="#2196F3" style="width:40px;height:40px;border-radius:50%;border:3px solid transparent;cursor:pointer;background:#2196F3" onclick="selectPremiumColor(this,'#2196F3')"></button>
<button class="premium-color-btn" data-color="#FF9800" style="width:40px;height:40px;border-radius:50%;border:3px solid transparent;cursor:pointer;background:#FF9800" onclick="selectPremiumColor(this,'#FF9800')"></button>
<button class="premium-color-btn" data-color="#E91E63" style="width:40px;height:40px;border-radius:50%;border:3px solid transparent;cursor:pointer;background:#E91E63" onclick="selectPremiumColor(this,'#E91E63')"></button>
<button class="premium-color-btn" data-color="#00BCD4" style="width:40px;height:40px;border-radius:50%;border:3px solid transparent;cursor:pointer;background:#00BCD4" onclick="selectPremiumColor(this,'#00BCD4')"></button>
<button class="premium-color-btn" data-color="#FFEB3B" style="width:40px;height:40px;border-radius:50%;border:3px solid transparent;cursor:pointer;background:#FFEB3B" onclick="selectPremiumColor(this,'#FFEB3B')"></button>
</div>
<input type="text" id="premium-color-custom" placeholder="Свой цвет (например #FF0000)" maxlength="7" style="width:100%;background:#2A2A38;border:1px solid #3A3A48;border-radius:8px;padding:10px 12px;font-size:14px;font-family:inherit;color:#E8E8ED;outline:none;margin-bottom:10px">
<button class="btn-submit" onclick="activatePremium()">Купить на 30 дней</button>
<button class="btn-submit secondary" onclick="applyPremiumColor()">Применить цвет</button>
<button class="btn-submit secondary" onclick="togglePremiumModal(false)">Закрыть</button>
</div>
</div>
<div id="chat-screen" class="screen">
<div class="header">
<div class="header-left"><button class="btn-icon" onclick="closeChat()">&larr;</button><h2 id="chat-room-title">Чат</h2></div>
<div class="header-right">
<button class="btn-icon" onclick="openPremium()" title="Премиум" style="background:#FFD700;color:#1A1A24">&#x2605;</button>
<button class="btn-icon" onclick="openParticipants()" title="Участники">&#x1f465;</button>
<span id="online-count" class="status-connected" style="display:none">0</span>
<span id="connection-status" class="status-connecting">...</span>
</div>
</div>
<div id="reply-bar" class="reply-bar">
<span class="reply-label">Ответ на <span class="reply-name" id="reply-name"></span>: <span id="reply-text"></span></span>
<button class="reply-cancel" onclick="cancelReply()">x</button>
</div>
<div id="chat-messages"></div>
<div class="chat-input-container">
<input type="text" id="chat-input" placeholder="Сообщение..." maxlength="500" autocomplete="off">
<button class="btn-send" id="btn-send" disabled>&#x27a4;</button>
</div>
</div>
<script>
const API='https://roomer-alh1mikk.amvera.io',WS='wss://roomer-alh1mikk.amvera.io';
let tgUserId=null,tgUserName='Аноним',tgInitData='',isTelegramUser=false,isVerifiedUser=false;
if(window.Telegram&&window.Telegram.WebApp){const tg=window.Telegram.WebApp;try{tg.ready();tg.expand()}catch(e){}
isTelegramUser=true;if(tg.initData)tgInitData=tg.initData
if(tg.initDataUnsafe?.user?.id){tgUserId=tg.initDataUnsafe.user.id;tgUserName=tg.initDataUnsafe.user.first_name||tgUserName}}
if(!tgUserId){const p=new URLSearchParams(location.search);if(p.has('tg_id')){tgUserId=parseInt(p.get('tg_id'));tgUserName=p.get('username')||tgUserName}}
if(!tgUserId){const s=sessionStorage.getItem('roomer_temp_id');if(s)tgUserId=parseInt(s);else{tgUserId=Math.floor(Math.random()*90000)+10000;sessionStorage.setItem('roomer_temp_id',tgUserId.toString())}}
if(isTelegramUser&&tgUserId){sessionStorage.setItem('roomer_tg_id',tgUserId.toString());sessionStorage.setItem('roomer_tg_name',tgUserName);if(tgInitData)sessionStorage.setItem('roomer_initdata',tgInitData)}

let ws=null,pingInterval=null,currentRoomId=null,shouldReconnect=false,reconnectAttempts=0,lastPong=Date.now(),onlineCount=0,currentTab='all',searchQuery='',searchTimer=null,replyToId=null,replyToName='',userVotes={};

function ft(d){if(!d)return'';return new Date(d).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})}
function st(t,d){const e=document.getElementById('toast');e.textContent=t;e.classList.add('visible');clearTimeout(e._hide);e._hide=setTimeout(()=>e.classList.remove('visible'),d||2500)}
function sc(s){document.querySelectorAll('.screen').forEach(e=>e.classList.remove('active'));const e=document.getElementById(s);if(e)e.classList.add('active')}
function ucs(s){const e=document.getElementById('connection-status');if(!e)return;const t={connected:'онлайн',connecting:'...',disconnected:'офлайн'},c={connected:'status-connected',connecting:'status-connecting',disconnected:'status-disconnected'};e.textContent=t[s]||t.disconnected;e.className=c[s]||c.disconnected}
function uoc(c){const e=document.getElementById('online-count');if(!e)return;onlineCount=c;if(c>0){e.textContent=c+' в сети';e.style.display=''}else e.style.display='none'}

async function apiFetch(url,opts={}){const def={mode:'cors',headers:{'Content-Type':'application/json'}};const m={...def,...opts};if(m.headers)m.headers={...def.headers,...opts.headers};const r=await fetch(API+url,m);const b=await r.text();if(!r.ok){let e='';try{const j=JSON.parse(b);e=j.error||j.detail||b}catch(e){e=b||r.statusText}throw new Error(e)}try{return JSON.parse(b)}catch(e){return b}}

async function loginUser(){try{const r=await apiFetch('/auth/login',{method:'POST',body:JSON.stringify({tg_id:tgUserId,username:tgUserName,bio:'',init_data:tgInitData})});if(r.status==='success'){tgUserId=r.tg_id;tgUserName=r.username;sessionStorage.setItem('roomer_tg_id',tgUserId.toString());sessionStorage.setItem('roomer_tg_name',tgUserName)}}catch(e){}}

async function fetchRooms(){const list=document.getElementById('rooms-list');let url='/rooms';if(currentTab==='my'){if(!tgUserId||tgUserId<1){list.innerHTML='<div class="empty-state">Войдите через Telegram</div>';return};url='/my-rooms?tg_id='+tgUserId}else url='/rooms?tg_id='+(tgUserId||0);if(searchQuery.trim())url='/rooms/search?q='+encodeURIComponent(searchQuery)+'&tg_id='+(tgUserId||0);try{const rooms=await apiFetch(url);if(!rooms||rooms.length===0){list.innerHTML=searchQuery?'<div class="empty-state">Ничего не найдено</div>':currentTab==='my'?'<div class="empty-state">Вы не создали комнат</div>':'<div class="empty-state">Комнат пока нет</div>';return}
if(tgUserId&&tgUserId>0){for(const room of rooms){try{const v=await apiFetch('/rooms/'+room.id+'/my-vote?tg_id='+tgUserId);userVotes[room.id]=v.vote}catch(e){}}}
list.innerHTML=rooms.map(room=>{const rating=room.rating||0,likes=room.likes_count||0,dislikes=room.dislikes_count||0,isFav=room.is_favorite,myVote=userVotes[room.id]||0,rc=rating>0?'#4CAF50':rating<0?'#F44336':'#6B6B80';return '<div class="card" onclick="openChat('+room.id+')">'+
'<h3>'+(room.title||'Без названия')+(room.online>0?'<span class="online-badge">'+room.online+'</span>':'')+'</h3>'+
'<p>'+(room.description||'')+'</p>'+
'<div class="tags">'+((room.tags||[]).map(t=>'<span class="tag">#'+t+'</span>').join(''))+'</div>'+
'<div class="card-actions">'+
'<span style="font-size:12px;color:'+rc+';font-weight:600">'+rating+'</span>'+
'<button class="action-btn'+(myVote===1?' liked':'')+'" onclick="event.stopPropagation();voteRoom('+room.id+',1)">+ '+likes+'</button>'+
'<button class="action-btn'+(myVote===-1?' disliked':'')+'" onclick="event.stopPropagation();voteRoom('+room.id+',-1)">- '+dislikes+'</button>'+
'<button class="favorite-btn'+(isFav?' is-fav':'')+'" onclick="event.stopPropagation();toggleFavorite('+room.id+',this)">'+(isFav?'В избранном':'В избранное')+'</button>'+
'</div></div>'}).join('')}catch(e){list.innerHTML='<div class="empty-state" style="color:#E55">Ошибка: '+e.message+'<br><br><button class="btn-submit" style="width:auto;padding:8px 20px;display:inline-block" onclick="fetchRooms()">Повторить</button></div>'}}

async function toggleFavorite(roomId,el){if(!tgUserId){st('Войдите через Telegram');return}try{const r=await apiFetch('/rooms/'+roomId+'/favorite?tg_id='+tgUserId+'&action=toggle',{method:'POST'});if(r.is_favorite){el.textContent='В избранном';el.className='favorite-btn is-fav'}else{el.textContent='В избранное';el.className='favorite-btn'};st(r.is_favorite?'Добавлено':'Удалено')}catch(e){st('Ошибка')}}
async function voteRoom(roomId,vote){if(!tgUserId){st('Войдите через Telegram');return}try{const r=await apiFetch('/rooms/vote',{method:'POST',body:JSON.stringify({tg_id:tgUserId,room_id:roomId,vote:vote})});if(r.status==='success'){userVotes[roomId]=r.vote;st('Голос учтён!');fetchRooms()}else if(r.error)st(r.error)}catch(e){st(e.message||'Ошибка голосования')}}
function refreshRooms(btn){btn.classList.add('spinning');setTimeout(()=>btn.classList.remove('spinning'),600);document.getElementById('rooms-list').innerHTML='<div class="loading"></div><div class="loading"></div><div class="loading"></div>';fetchRooms()}
function onSearchInput(){const i=document.getElementById('search-input'),c=document.getElementById('btn-clear-search');searchQuery=i.value.trim();c.classList.toggle('visible',i.value.length>0);clearTimeout(searchTimer);searchTimer=setTimeout(()=>{document.getElementById('rooms-list').innerHTML='<div class="loading"></div><div class="loading"></div><div class="loading"></div>';fetchRooms()},300)}
function clearSearch(){document.getElementById('search-input').value='';document.getElementById('btn-clear-search').classList.remove('visible');searchQuery='';document.getElementById('rooms-list').innerHTML='<div class="loading"></div><div class="loading"></div><div class="loading"></div>';fetchRooms()}
function switchTab(tab){currentTab=tab;document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===tab));document.getElementById('rooms-list').innerHTML='<div class="loading"></div><div class="loading"></div><div class="loading"></div>';fetchRooms()}
async function submitRoom(){const title=document.getElementById('room-title').value.trim(),desc=document.getElementById('room-desc').value.trim(),tags=document.getElementById('room-tags').value.split(',').map(t=>t.trim()).filter(t=>t).slice(0,10),btn=document.getElementById('btn-create-room');if(!title){st('Введите название');return};btn.disabled=true;btn.textContent='Создание...';try{await apiFetch('/rooms',{method:'POST',body:JSON.stringify({title,description:desc,creator_id:tgUserId,tags})});document.getElementById('room-title').value='';document.getElementById('room-desc').value='';document.getElementById('room-tags').value='';toggleModal(false);st('Комната создана!');fetchRooms()}catch(e){st('Ошибка: '+e.message)}finally{btn.disabled=false;btn.textContent='Создать'}}

function setupWebSocket(roomId){if(ws){ws.onclose=null;ws.close();ws=null};if(pingInterval){clearInterval(pingInterval);pingInterval=null};reconnectAttempts=0;lastPong=Date.now();ucs('connecting');const wsUrl=WS+'/ws/'+roomId+'?user_name='+encodeURIComponent(tgUserName)+'&tg_id='+tgUserId;try{ws=new WebSocket(wsUrl)}catch(e){ucs('disconnected');return}
ws.onopen=()=>{ucs('connected');reconnectAttempts=0;lastPong=Date.now();pingInterval=setInterval(()=>{if(ws&&ws.readyState===WebSocket.OPEN){if(Date.now()-lastPong>60000){reconnectWs(roomId);return};ws.send(JSON.stringify({type:'ping'}))}},15000)}
ws.onerror=(e)=>{};ws.onclose=(e)=>{ucs('disconnected');if(pingInterval){clearInterval(pingInterval);pingInterval=null};if(shouldReconnect&&currentRoomId===roomId){reconnectAttempts++;setTimeout(()=>{if(shouldReconnect&&currentRoomId===roomId)setupWebSocket(roomId)},Math.min(1000*Math.pow(1.5,reconnectAttempts),10000))}}

function addMsgToChat(d){const box=document.getElementById('chat-messages');if(!box)return
if(d.type==='ping'||d.type==='pong')return
if(d.type==='edit'){const el=document.getElementById('msg-'+d.id);if(el){const txt=el.querySelector('.msg-text');if(txt)txt.textContent=d.text;const ed=el.querySelector('.edited-label');if(ed)ed.style.display='inline'};return}
if(d.type==='delete'){const el=document.getElementById('msg-'+d.id);if(el)el.outerHTML='<div id="msg-'+d.id+'" class="msg deleted-msg"><div class="bubble">Сообщение удалено</div></div>';return}
if(d.id&&document.getElementById('msg-'+d.id))return
const isMine=Number(d.tg_id)===Number(tgUserId)
const m=document.createElement('div')
if(d.is_deleted){m.id='msg-'+d.id;m.className='msg deleted-msg';m.innerHTML='<div class="bubble">Сообщение удалено</div>';box.appendChild(m);return}
if(d.type==='system'){m.className='msg system-msg';let txt=d.text||''
if(d.room_title){document.getElementById('chat-room-title').textContent=d.room_title}
let extra=''
if(d.online!==undefined){extra='<br><span style="color:#4CAF50">'+d.online+' в сети</span>'}
m.innerHTML='<div class="bubble">'+txt+extra+'</div>';box.appendChild(m);box.scrollTo({top:box.scrollHeight,behavior:'smooth'});return}
m.id='msg-'+d.id;m.className='msg '+(isMine?'my-msg':'other-msg')
let bubbleStyle=''
if(d.message_color&&isMine)bubbleStyle='style="background:'+d.message_color+'"'
let html='<div class="bubble" '+bubbleStyle+'>'
if(!isMine&&d.username)html+='<div class="msg-author">'+(d.username||'')+'</div>'
if(d.reply_to)html+='<div class="reply-block"><span class="reply-author">'+(d.reply_to.username||'')+'</span>: '+d.reply_to.text+'</div>'
html+='<span class="msg-text">'+(d.text||'')+'</span>'
html+='<div class="msg-footer">'
if(d.edited_at)html+='<span class="edited-label msg-edited">ред.</span>'
html+='<span class="msg-time">'+ft(d.timestamp)+'</span>'
html+='</div></div>'
html+='<div class="msg-actions">'
if(isMine)html+='<button class="msg-action-btn" onclick="event.stopPropagation();editMsg('+d.id+')">ред.</button>'
html+='<button class="msg-action-btn" onclick="event.stopPropagation();deleteMsg('+d.id+')">x</button>'
html+='<button class="msg-action-btn" onclick="event.stopPropagation();replyToMsg('+d.id+',\''+(d.username||'')+'\')">отв.</button>'
html+='</div>'
m.innerHTML=html;box.appendChild(m);box.scrollTo({top:box.scrollHeight,behavior:'smooth'})}

ws.onmessage=(e)=>{try{lastPong=Date.now();const d=JSON.parse(e.data);addMsgToChat(d)}catch(e){console.error('WS parse:',e)}}}

function reconnectWs(roomId){shouldReconnect=false;if(ws){ws.onclose=null;ws.close();ws=null};if(pingInterval){clearInterval(pingInterval);pingInterval=null};shouldReconnect=true;setupWebSocket(roomId)}

function replyToMsg(msgId,username){replyToId=msgId;replyToName=username;const el=document.getElementById('msg-'+msgId);const txt=el?el.querySelector('.msg-text')?.textContent||'':'';document.getElementById('reply-bar').style.display='flex';document.getElementById('reply-name').textContent=username;document.getElementById('reply-text').textContent=txt.slice(0,80);document.getElementById('chat-input').focus()}
function cancelReply(){replyToId=null;replyToName='';document.getElementById('reply-bar').style.display='none';document.getElementById('reply-name').textContent='';document.getElementById('reply-text').textContent=''}
async function openChat(roomId){currentRoomId=roomId;shouldReconnect=true;onlineCount=0;uoc(0);cancelReply();document.getElementById('chat-room-title').textContent='Загрузка...';document.getElementById('chat-messages').innerHTML='';ucs('connecting');sc('chat-screen');setTimeout(()=>setupWebSocket(roomId),100)}
// Загружаем название комнаты через API как fallback
try{apiFetch('/rooms/'+roomId+'/info').then(info=>{if(info&&info.title)document.getElementById('chat-room-title').textContent=info.title}).catch(()=>{})}catch(e){}

function sendWsMessage(){const input=document.getElementById('chat-input'),text=input.value.trim();if(!text)return;if(!ws||ws.readyState!==WebSocket.OPEN){st('Нет подключения');if(currentRoomId)setupWebSocket(currentRoomId);return}
ws.send(JSON.stringify({type:'message',text:text,username:tgUserName,reply_to_id:replyToId}));input.value='';document.getElementById('btn-send').disabled=true;cancelReply()}

function editMsg(msgId){const el=document.getElementById('msg-'+msgId);if(!el)return;const txt=el.querySelector('.msg-text');if(!txt)return;const newText=prompt('Редактировать:',txt.textContent);if(newText&&newText.trim()){ws.send(JSON.stringify({type:'edit',id:msgId,text:newText.trim()}))}}

function deleteMsg(msgId){if(!confirm('Удалить сообщение?'))return;ws.send(JSON.stringify({type:'delete',id:msgId}))}

function closeChat(){shouldReconnect=false;currentRoomId=null;cancelReply();if(pingInterval){clearInterval(pingInterval);pingInterval=null};if(ws){try{if(ws.readyState===WebSocket.OPEN)ws.send(JSON.stringify({type:'leave'}))}catch(e){};ws.onclose=null;ws.close(1000);ws=null};ucs('disconnected');uoc(0);sc('feed-screen');fetchRooms()}

// ─── Премиум ───
let selectedPremiumColor='#7C4DFF';
function togglePremiumModal(s){document.getElementById('premium-modal').style.display=s?'block':'none'}
document.getElementById('premium-modal').addEventListener('click',function(e){if(e.target===this)togglePremiumModal(false)})
function openPremium(){if(!tgUserId){st('Войдите через Telegram');return};togglePremiumModal(true)}
function selectPremiumColor(el,color){document.querySelectorAll('.premium-color-btn').forEach(b=>b.style.borderColor='transparent');el.style.borderColor='#fff';selectedPremiumColor=color;document.getElementById('premium-color-custom').value=color}
document.getElementById('premium-color-custom').addEventListener('input',function(){if(this.value.match(/^#[0-9A-Fa-f]{6}$/)){selectedPremiumColor=this.value;document.querySelectorAll('.premium-color-btn').forEach(b=>b.style.borderColor='transparent')}})
async function activatePremium(){if(!tgUserId){st('Войдите через Telegram');return};const btn=document.querySelector('#premium-modal .btn-submit:first-of-type');btn.disabled=true;btn.textContent='Активация...';try{const r=await apiFetch('/premium/activate',{method:'POST',body:JSON.stringify({tg_id:tgUserId,color:selectedPremiumColor})});if(r.status==='success'){st('Премиум активирован! Цвет: '+r.message_color)}else if(r.error)st(r.error)}catch(e){st(e.message||'Ошибка')}finally{btn.disabled=false;btn.textContent='Купить на 30 дней'}}
async function applyPremiumColor(){if(!tgUserId){st('Войдите через Telegram');return};try{const r=await apiFetch('/premium/set-color',{method:'POST',body:JSON.stringify({tg_id:tgUserId,color:selectedPremiumColor})});if(r.status==='success'){st('Цвет изменён: '+r.message_color);togglePremiumModal(false)}else if(r.error)st(r.error)}catch(e){st(e.message||'Ошибка')}}

// ─── Участники ───
function toggleParticipantsModal(s){document.getElementById('participants-modal').style.display=s?'block':'none'}
document.getElementById('participants-modal').addEventListener('click',function(e){if(e.target===this)toggleParticipantsModal(false)})
async function openParticipants(){if(!currentRoomId){st('Нет комнаты');return}
toggleParticipantsModal(true);document.getElementById('participants-modal-title').textContent='Участники';document.getElementById('participants-list').innerHTML='<div class="loading" style="height:40px"></div>';document.getElementById('participants-count').textContent='загрузка...'
try{const participants=await apiFetch('/rooms/'+currentRoomId+'/participants')
const onlineCount=participants.filter(p=>p.online).length
document.getElementById('participants-count').textContent='всего '+participants.length+', онлайн '+onlineCount
document.getElementById('participants-list').innerHTML=participants.map(p=>{
const initial=(p.username||'?')[0].toUpperCase()
const roleLabels={creator:'Создатель',admin:'Админ',member:'Участник',guest:'Гость'}
return '<div class="participant-item">'+
'<div class="participant-avatar">'+initial+'</div>'+
'<div class="participant-info">'+
'<div class="participant-name">'+p.username+'</div>'+
'<div class="participant-role"><span class="role-badge '+p.role+'">'+roleLabels[p.role]||p.role+'</span></div>'+
'</div>'+
'<div class="participant-status '+(p.online?'online':'offline')+'"></div>'+
'</div>'}).join('')}catch(e){document.getElementById('participants-list').innerHTML='<div class="empty-state" style="color:#E55">Ошибка загрузки</div>';document.getElementById('participants-count').textContent=''}}

window.addEventListener('beforeunload',()=>{if(ws&&ws.readyState===WebSocket.OPEN){ws.send(JSON.stringify({type:'leave'}));ws.close(1000,'Page closing')};if(pingInterval)clearInterval(pingInterval)})
function toggleModal(s){document.getElementById('create-modal').style.display=s?'block':'none';if(s)document.getElementById('room-title').focus()}
document.getElementById('create-modal').addEventListener('click',function(e){if(e.target===this)toggleModal(false)})
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(document.getElementById('create-modal').style.display==='block')toggleModal(false);if(document.getElementById('participants-modal').style.display==='block')toggleParticipantsModal(false)}})
document.getElementById('chat-input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendWsMessage()}})
document.getElementById('chat-input').addEventListener('input',function(){document.getElementById('btn-send').disabled=this.value.trim().length===0})
document.getElementById('btn-send').addEventListener('click',sendWsMessage)
document.getElementById('search-input').addEventListener('input',onSearchInput)
loginUser().then(()=>fetchRooms())
</script>
</body>
